<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bebek Günlüğü</title>
<meta name="theme-color" content="#2f7d78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bebek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Renkler: açık tema; telefon karanlık moddaysa aşağıdaki koyu renkler kullanılır */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#1f2a37; --muted:#66727f; --line:#dde3e9;
  --accent:#2f7d78; --accent-fg:#ffffff;
  --sleep:#5b6bbf; --feed:#d07a3e; --bottle:#c2913a; --grow:#3d8f5a; --med:#8a5bb5; --fever:#c9443b;
  --warn-soft:#fbe4e1;
  --font:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161c; --surface:#1b2129; --fg:#e7ecf1; --muted:#97a3b0; --line:#2b333d;
  --accent:#5fb8b1; --accent-fg:#0f1a1a;
  --sleep:#8f9cf0; --feed:#eba06a; --bottle:#e2bb68; --grow:#72c28d; --med:#bb93e0; --fever:#f07a70;
  --warn-soft:#3a2220; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-block:16px calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:1.6rem;font-weight:800}
.age{color:var(--muted);font-size:.95rem}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted);font-size:.9rem}
.note{font-size:.9rem;color:var(--muted)}
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat .v{font-size:1.25rem;font-weight:800;margin-top:2px}
.stat .s{font-size:.85rem;color:var(--muted)}
.stat.fever{background:var(--warn-soft);border-color:var(--fever)}
.sleepbtn{width:100%;border:none;border-radius:16px;padding:18px;font-size:1.15rem;font-weight:800;background:var(--sleep);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.sleepbtn small{font-weight:600;opacity:.9;font-size:.9rem}
.sleepbtn.awake{background:var(--accent);color:var(--accent-fg)}
.sleepbtn:disabled,.qb:disabled{opacity:.5}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.95rem}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.d-uyku{background:var(--sleep)}.d-emzirme{background:var(--feed)}.d-biberon{background:var(--bottle)}
.d-olcum{background:var(--grow)}.d-ilac{background:var(--med)}.d-ates{background:var(--fever)}
.day h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:6px 0 8px;font-weight:800}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .time{font-weight:800;font-size:.95rem}
.row .what{min-width:0}
.row .what b{font-weight:700}
.row .what .by{display:block;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.row.hot .what b{color:var(--fever)}
.acts{display:flex;gap:4px}
.icon{background:none;border:none;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:.85rem;font-weight:700}
.icon.danger{color:var(--fever)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.sheet h2{font-size:1.25rem;display:flex;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:700;color:var(--muted)}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btns{display:flex;gap:10px}
.primary{flex:1;background:var(--accent);color:var(--accent-fg);border:none;border-radius:12px;padding:13px;font-weight:800;font-size:1rem}
.secondary{background:none;border:1px solid var(--line);border-radius:12px;padding:13px 18px;font-weight:700}
.err{color:var(--fever);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.login{max-width:420px;margin:12vh auto 0;width:100%}
.login .logo{width:64px;height:64px;border-radius:16px}
@media (max-width:380px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<!-- Giriş ekranı -->
<div class="wrap" id="loginView" hidden>
  <form class="card login" id="loginForm">
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1 style="font-size:1.5rem">Bebek Günlüğü</h1>
    <div class="field"><label for="lEmail">E-posta</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Şifre</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="primary" type="submit">Giriş yap</button>
    <div class="err" id="lErr"></div>
  </form>
</div>

<!-- Kurulum eksikse -->
<div class="wrap" id="configView" hidden>
  <div class="card login">
    <h1 style="font-size:1.4rem">Kurulum tamamlanmadı</h1>
    <p class="note">firebase-config.js dosyasına Firebase bilgilerini yapıştır. Adımlar README.md dosyasında.</p>
  </div>
</div>

<!-- Ana uygulama -->
<div class="wrap" id="appView" hidden>
  <header>
    <div>
      <h1 id="babyName">Bebek Günlüğü</h1>
      <div class="age" id="babyAge">Kayıtlar yükleniyor…</div>
    </div>
    <div class="hbtns">
      <button class="ghost" id="editProfile" hidden>Bilgiler</button>
      <button class="ghost" id="logout">Çıkış</button>
    </div>
  </header>

  <div id="banner" class="note" hidden></div>
  <div id="setupBox"></div>

  <section class="status" id="status" aria-label="Bugünün özeti"></section>

  <button class="sleepbtn" id="sleepBtn" disabled>Uyudu<small>Uykuyu şimdi başlat</small></button>

  <section class="quick" aria-label="Kayıt ekle">
    <button class="qb" data-new="emzirme"><span class="dot d-emzirme"></span>Emzirme</button>
    <button class="qb" data-new="biberon"><span class="dot d-biberon"></span>Biberon</button>
    <button class="qb" data-new="uyku"><span class="dot d-uyku"></span>Geçmiş uyku</button>
    <button class="qb" data-new="olcum"><span class="dot d-olcum"></span>Kilo / Boy</button>
    <button class="qb" data-new="ilac"><span class="dot d-ilac"></span>İlaç</button>
    <button class="qb" data-new="ates"><span class="dot d-ates"></span>Ateş</button>
  </section>

  <section id="timeline" aria-label="Kayıtlar">
    <div class="empty">Kayıtlar yükleniyor…</div>
  </section>
</div>
<div id="sheetHost"></div>

<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
